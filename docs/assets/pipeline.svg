<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="How a search flows through Apple Notes: your search becomes one Spotlight query, Spotlight matches it against indexed words, results are sorted by exact title, type and date, and the first two become Top Hits.">
  <title>How Apple Notes runs a search</title>
  <style>
    .box   { fill: #f6f8fa; stroke: #d0d7de; }
    .accent{ fill: #ddf4ff; stroke: #54aeff; }
    .label { fill: #57606a; font: 600 11px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; letter-spacing: .06em; }
    .title { fill: #1f2328; font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
    .body  { fill: #57606a; font: 12.5px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
    .code  { fill: #0550ae; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; fill: none; stroke-width: 1.5; }
    .head  { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #161b22; stroke: #30363d; }
      .accent{ fill: #0c2d4b; stroke: #1f6feb; }
      .label { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .body  { fill: #8b949e; }
      .code  { fill: #79c0ff; }
      .arrow { stroke: #6e7681; }
      .head  { fill: #6e7681; }
    }
  </style>

  <!-- 1. Your search -->
  <rect class="box" x="1" y="30" width="190" height="140" rx="10"/>
  <text class="label" x="18" y="56">1 · YOU TYPE</text>
  <text class="code" x="18" y="88">lisbon tram</text>
  <text class="body" x="18" y="118">Any words, any order.</text>
  <text class="body" x="18" y="136">Dates such as "last month"</text>
  <text class="body" x="18" y="154">become filters.</text>

  <!-- 2. One query -->
  <rect class="accent" x="230" y="30" width="200" height="140" rx="10"/>
  <text class="label" x="247" y="56">2 · ONE QUERY</text>
  <text class="code" x="247" y="88">"*lisbon tram*"cwdt</text>
  <text class="body" x="247" y="118">First word: anywhere</text>
  <text class="body" x="247" y="136">inside a word. Later words:</text>
  <text class="body" x="247" y="154">start of a word.</text>

  <!-- 3. Spotlight -->
  <rect class="box" x="469" y="30" width="190" height="140" rx="10"/>
  <text class="label" x="486" y="56">3 · SPOTLIGHT</text>
  <text class="title" x="486" y="88">Indexed words</text>
  <text class="body" x="486" y="118">Case and accents ignored.</text>
  <text class="body" x="486" y="136">user@example.com is stored</text>
  <text class="body" x="486" y="154">whole and in parts.</text>

  <!-- 4. Order -->
  <rect class="box" x="698" y="30" width="181" height="140" rx="10"/>
  <text class="label" x="715" y="56">4 · ORDER</text>
  <text class="title" x="715" y="88">Exact title</text>
  <text class="body" x="715" y="112">then notes before</text>
  <text class="body" x="715" y="130">attachments, then newest.</text>
  <text class="body" x="715" y="154">First two are Top Hits.</text>

  <!-- arrows -->
  <path class="arrow" d="M193 100h29"/><path class="head" d="M229 100l-8-4.5v9z"/>
  <path class="arrow" d="M432 100h29"/><path class="head" d="M468 100l-8-4.5v9z"/>
  <path class="arrow" d="M661 100h29"/><path class="head" d="M697 100l-8-4.5v9z"/>
</svg>
