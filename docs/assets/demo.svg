  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <text x="22" y="70" xml:space="preserve"><tspan fill="#7ee787">$</tspan> <tspan fill="#d7dae0">notes-search search "ill"</tspan></text>
