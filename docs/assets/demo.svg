  <text x="22" y="154" xml:space="preserve">    <tspan fill="#7d8590">Eggs, milk, bread and </tspan><tspan fill="#f2cc60" font-weight="600">vanilla</tspan></text>
  <text x="22" y="175" xml:space="preserve">  <tspan fill="#d7dae0">Crème brûlée</tspan><tspan fill="#7d8590"> · Cooking</tspan></text>
  <text x="22" y="196" xml:space="preserve">    <tspan fill="#7d8590">Cream, </tspan><tspan fill="#f2cc60" font-weight="600">vanilla</tspan><tspan fill="#7d8590">, sugar, egg yolks. Bake in a water bath.</tspan></text>
  <text x="22" y="217" xml:space="preserve"></text>
  <text x="22" y="238" xml:space="preserve"><tspan fill="#7ee787">$</tspan> <tspan fill="#d7dae0">notes-search search "belem tram"</tspan></text>
