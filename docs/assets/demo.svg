  <text x="22" y="301" xml:space="preserve">  <tspan fill="#d7dae0">Trip to Lisbon</tspan><tspan fill="#7d8590"> · Travel</tspan></text>
  <text x="22" y="322" xml:space="preserve">    <tspan fill="#7d8590">Try pastéis de nata at </tspan><tspan fill="#f2cc60" font-weight="600">Belém</tspan><tspan fill="#7d8590">. </tspan><tspan fill="#f2cc60" font-weight="600">Tram</tspan><tspan fill="#7d8590"> 28 to Alfama.</tspan></text>
